# Tsuzuku (anime-tracker) on hub, the Hetzner box shared with other apps
# (~/code/backlog/hetzner-consolidation.md), behind kamal-proxy, which routes by hostname and gets the
# certificate. tsuzuku.okanerturan.com is a DNS-only record (Cloudflare's proxy off) pointing here; the app
# checks the passphrase itself (server/passgate.js). Deploy: bin/kamal deploy (see AGENTS.md).
service: anime-tracker
image: anime-tracker

# The box is shared, so the container has a ceiling.
servers:
  web:
    hosts:
      - 178.104.118.172
    options:
      memory: 1g
      cpus: 1

proxy:
  ssl: true
  host: tsuzuku.okanerturan.com
  app_port: 3000
  healthcheck:
    path: /up

# The database, image cache and nightly copies. Owned by uid 1000 (the image's node user).
# /srv/anime-tracker/backups is in hub-backup's restic paths (offsite to the Storage Box).
volumes:
  - /srv/anime-tracker:/data

# No registry account: Kamal runs a registry on this Mac and the hub pulls through the SSH tunnel.
registry:
  server: localhost:5555

# Built here for amd64, never on the shared server.
builder:
  arch: amd64

env:
  clear:
    # One account behind a passphrase until accounts are switched on (migration step 5).
    AUTH_MODE: passphrase
    TIMEZONE: Europe/Tirane
    BACKUP_DIR: /data/backups
  secret:
    - APP_PASSPHRASE
    - TMDB_API_READ_ACCESS_TOKEN

aliases:
  logs: app logs -f
  console: app exec --interactive --reuse "sh"
