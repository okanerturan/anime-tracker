# Tsuzuku (anime-tracker) on hub, the Hetzner box shared with other apps
# (~/code/backlog/hetzner-consolidation.md), behind kamal-proxy. Visitors never come here directly:
# the Worker at anime-tracker.okan.workers.dev checks the passphrase and forwards with X-Origin-Auth,
# and the app refuses requests without it (AGENTS.md). Deploy: bin/kamal deploy (see AGENTS.md).
service: anime-tracker
image: anime-tracker

# The box is shared, so the container has a ceiling.
servers:
  web:
    hosts:
      - 178.104.118.172
    options:
      memory: 1g
      cpus: 1

proxy:
  ssl: true
  host: anime-tracker.178-104-118-172.sslip.io
  app_port: 3000
  healthcheck:
    path: /up

# The database, image cache and nightly copies. Owned by uid 1000 (the image's node user).
# /srv/anime-tracker/backups is in hub-backup's restic paths (offsite to the Storage Box).
volumes:
  - /srv/anime-tracker:/data

# No registry account: Kamal runs a registry on this Mac and the hub pulls through the SSH tunnel.
registry:
  server: localhost:5555

# Built here for amd64, never on the shared server.
builder:
  arch: amd64

env:
  clear:
    # One account behind the Worker's passphrase until accounts are switched on (migration step 5).
    AUTH_MODE: passphrase
    TIMEZONE: Europe/Tirane
    BACKUP_DIR: /data/backups
  secret:
    - ORIGIN_SECRET

aliases:
  logs: app logs -f
  console: app exec --interactive --reuse "sh"
