<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --bg: #14161c; --surface: #1d2029; --line: #2f3442; --text: #e8e9ee; --muted: #a7abb9; --faint: #737887; --accent: #f47521; --on-accent: #1b1206; --good: #5fd39a; }
  * { box-sizing: border-box; }
  body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 0; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; }
  header img { width: 20px; height: 20px; border-radius: 5px; }
  header h1 { font-size: 14px; margin: 0; flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dot.fresh { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .dot.bad { background: #ff8a80; }
  section { padding: 6px 16px 14px; }
  h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin: 8px 0 8px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  /* minmax(0, 1fr): a long title truncates instead of pushing the Play button out of the card. */
  .item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px 8px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; }
  .item img { width: 64px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: #0e1014; }
  .item > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .item .t { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: clip; }
  .new { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: 1px; }
  .item .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: clip; text-overflow: ellipsis; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: stretch; }
  .tick { width: 34px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .tick:hover { color: #4ade80; border-color: #2f6b47; } }
  .tick:disabled { opacity: 0.5; cursor: default; }
  .pair-row { display: flex; gap: 6px; } .pair-row input { flex: 1; min-width: 0; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; }
  .play { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 5px 10px; font-weight: 700; font-size: 12px; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { .item:hover { border-color: #444a5c; } .item:hover .play { filter: brightness(1.08); } }
  :is(a, button, summary, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item:active, button:active, a.btn:active { transform: scale(0.98); }
  .empty { color: var(--muted); padding: 12px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }
  .row { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .row:empty { display: none; }
  .err { color: #ff8a80; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button, a.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  button.secondary, a.btn.secondary { background: #2a2e3a; color: var(--text); }
  button:disabled { opacity: 0.5; cursor: default; }
  details { border-top: 1px solid var(--line); margin-top: 4px; }
  summary { cursor: pointer; color: var(--muted); padding: 10px 16px; font-size: 12px; }
  details > section { padding-top: 0; }
  input { width: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 8px; font: inherit; }
  label { display: block; margin-top: 12px; color: var(--muted); font-size: 12px; }
  .check-row { display: flex; gap: 8px; align-items: flex-start; }
  .check-row input { margin-top: 1px; }
  .check-row input { width: auto; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="">
    <h1>Anime Tracker</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="last">never synced</span></span>
  </header>
  <section>
    <h2>Up next</h2>
    <div class="list" id="upnext"><div class="empty">Loading…</div></div>
    <div class="actions">
      <a class="btn" id="open" href="#" target="_blank">Open dashboard</a>
      <button id="sync" class="secondary">Sync now</button>
    </div>
    <div class="row" id="result"></div>
    <div class="row err" id="error"></div>
  </section>
  <details>
    <summary>Settings</summary>
    <section>
      <label>Tracker URL <input id="url"></label>
      <label>Tracker key <input id="key" type="password" autocomplete="off" placeholder="only for the hosted tracker"></label>
      <label>Pairing code <span class="pair-row"><input id="pair" autocomplete="one-time-code" placeholder="XXXX-XXXX from the Connect page" spellcheck="false"><button id="pairGo" class="secondary" type="button">Connect</button></span></label>
      <div class="row" id="pairResult"></div>
      <label class="check-row"><input type="checkbox" id="notify"> Notify me when a show I'm watching has a new episode</label>
      <label class="check-row"><input type="checkbox" id="overlay"> Show my progress card on Crunchyroll show pages</label>
      <div class="actions"><button id="full" class="secondary">Full resync</button></div>
    </section>
  </details>
  <script src="popup.js"></script>
</body>
</html>
