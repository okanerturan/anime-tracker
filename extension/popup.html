<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(0.17 0.012 265); --surface: oklch(0.21 0.014 265); --surface-2: oklch(0.25 0.016 265);
    --line: oklch(0.3 0.018 265); --line-strong: oklch(0.38 0.02 265);
    --text: oklch(0.95 0.005 265); --muted: oklch(0.76 0.012 265); --faint: oklch(0.66 0.014 265);
    --accent: oklch(0.7 0.18 47); --accent-text: oklch(0.78 0.15 52); --on-accent: oklch(0.2 0.03 47);
    --good: oklch(0.8 0.15 158); --bad: oklch(0.75 0.14 25);
    --r-s: 8px; --r-m: 12px; --r-pill: 999px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Chrome caps a popup at 600px: header and footer stay put, only the middle scrolls. */
  html, body { margin: 0; }
  body {
    width: 460px; max-height: 600px; display: flex; flex-direction: column;
    font: 13px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
  }

  /* ---------- Header ---------- */
  .bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-block-end: 1px solid var(--line); }
  .bar img { width: 24px; height: 24px; border-radius: 6px; }
  .bar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .status { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dot.fresh { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .dot.bad { background: var(--bad); }
  .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; padding: 0; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn[aria-pressed="true"] { color: var(--text); border-color: var(--line-strong); background: var(--surface-2); }
  .icon-btn.busy svg { animation: spin 900ms linear infinite; }
  @keyframes spin { to { rotate: 1turn; } }

  /* ---------- Alerts: right under the header, never below the list ---------- */
  .alert { flex: none; display: flex; flex-direction: column; gap: 8px; margin: 10px 14px 0; padding: 10px 12px; border-radius: var(--r-m);
    background: color-mix(in oklch, var(--bad) 12%, var(--bg)); border: 1px solid color-mix(in oklch, var(--bad) 35%, var(--bg)); color: var(--text); font-size: 12px; }
  .alert[hidden] { display: none; }
  .alert .msg { color: color-mix(in oklch, var(--bad) 70%, var(--text)); }
  .alert button { align-self: start; }
  .note { flex: none; margin: 8px 14px 0; color: var(--muted); font-size: 12px; }
  .note:empty { display: none; }

  /* ---------- Scrolling middle ---------- */
  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 12px 14px; }
  .view[hidden] { display: none; }
  .head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; }
  h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 0; }
  .head .count { color: var(--faint); font-size: 12px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  /* The kept list is showing because the tracker couldn't be reached: say so above it. */
  .stale { margin: 0 0 8px; color: color-mix(in oklch, var(--bad) 70%, var(--text)); font-size: 12px; }
  .stale:empty { display: none; }

  /* One card per show: the next episode's still fills the card's left side, edge to edge and as tall
     as the card, with Play on it; the text sits beside it and the ✓ at the far end. The title link
     stretches over the whole card, so anywhere on it plays; the ✓ sits above that link. */
  .item { position: relative; display: grid; grid-template-columns: 148px minmax(0, 1fr) auto; align-items: center; min-block-size: 84px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: clip; }
  .thumb { position: relative; align-self: stretch; min-block-size: 84px; overflow: clip; background: oklch(0.13 0.01 265); }
  /* Out of flow, so a tall still never sets the card's height: the text does, and the still covers it. */
  .thumb img { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; object-fit: cover; }
  .thumb img:not([src]) { visibility: hidden; }
  /* A shade under the Play pill, and a hairline where the still meets the text. */
  .thumb::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, oklch(0 0 none / 0.5), transparent 46%); box-shadow: inset -1px 0 0 oklch(1 0 none / 0.08); }
  .play { position: absolute; z-index: 1; inset-inline-start: 8px; inset-block-end: 8px; display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px 4px 8px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent);
    font-weight: 700; font-size: 12px; line-height: 1.3; white-space: nowrap; font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 8px oklch(0 0 none / 0.4); }
  .play.quiet { background: color-mix(in oklch, black 72%, transparent); color: var(--text); }
  .text { min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 10px 4px 10px 12px; }
  .t { color: inherit; text-decoration: none; font-weight: 650; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: clip; }
  .t::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
  .t:focus-visible { outline: none; }
  .item:has(.t:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .new { display: inline-block; margin-inline-end: 6px; padding: 1px 6px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: 1px; }
  .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: clip; text-overflow: ellipsis; }
  .m { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: clip; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .tick { position: relative; z-index: 1; margin-inline: 4px 10px; inline-size: 34px; block-size: 34px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); font: inherit; font-size: 14px; line-height: 1; padding: 0; cursor: pointer; }
  .tick:disabled { opacity: 0.5; cursor: default; }
  .s .linkish { position: relative; z-index: 1; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent-text); font: inherit; font-weight: 700; cursor: pointer; }
  .empty { color: var(--muted); padding: 18px 12px; border: 1px dashed var(--line); border-radius: var(--r-m); text-align: center; }

  /* ---------- Settings view ---------- */
  .group { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); }
  .group + h2 { margin-block-start: 16px; }
  h2 + .group { margin-block-start: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  input:not([type="checkbox"]) { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: var(--r-s); padding: 8px 9px; font: inherit; }
  .pair-row { display: flex; gap: 6px; } .pair-row input { flex: 1; min-width: 0; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--text); cursor: pointer; }
  .switch input { appearance: none; flex: none; width: 34px; height: 20px; margin: 0; border-radius: var(--r-pill); background: var(--line); position: relative; cursor: pointer; }
  .switch input::after { content: ""; position: absolute; inset-block-start: 3px; inset-inline-start: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { translate: 14px 0; background: var(--on-accent); }
  .hint { color: var(--faint); font-size: 12px; margin: 0; }
  .row { color: var(--muted); font-size: 12px; } .row:empty { display: none; }

  /* ---------- Footer ---------- */
  .foot { flex: none; display: flex; gap: 8px; padding: 10px 14px 12px; border-block-start: 1px solid var(--line); }
  .foot .btn { flex: 1; }
  button, a.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--on-accent); border: 0; border-radius: var(--r-s); padding: 9px 12px; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; }
  button.secondary, a.btn.secondary { background: var(--surface-2); color: var(--text); }
  button:disabled { opacity: 0.5; cursor: default; }

  /* ---------- States ---------- */
  :is(a, button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  :is(button, a.btn):active:not(:disabled) { transform: scale(0.97); }
  .item:has(.t:active) .play { transform: scale(0.96); }
  @media (hover: hover) and (pointer: fine) {
    .icon-btn:hover:not(:disabled) { color: var(--text); border-color: var(--line-strong); }
    /* Hovering the card: its edge lifts, the still eases in a touch, Play brightens. */
    .item:has(.t:hover) { border-color: var(--line-strong); background: color-mix(in oklch, var(--surface) 70%, var(--surface-2)); }
    .item:has(.t:hover) .thumb img { scale: 1.04; }
    .item:has(.t:hover) .play { filter: brightness(1.1); }
    :is(a.btn, button:not(.icon-btn, .tick, .linkish)):hover:not(:disabled) { filter: brightness(1.08); }
    .tick:hover:not(:disabled) { color: var(--good); border-color: color-mix(in oklch, var(--good) 45%, var(--bg)); }
  }
  @media (prefers-reduced-motion: no-preference) {
    :is(button, a.btn, .play) { transition: transform 120ms var(--ease), filter 150ms var(--ease); }
    .thumb img { transition: scale 220ms var(--ease); }
    .switch input::after { transition: translate 160ms var(--ease); }
    /* The list arrives one card after another. */
    .item { animation: item-in 320ms var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  }
  @keyframes item-in { from { opacity: 0; translate: 0 8px; } }
  @media (prefers-reduced-motion: reduce) { .icon-btn.busy svg { animation: none; } }
</style>
</head>
<body>
  <header class="bar">
    <img src="icons/icon-32.png" alt="">
    <h1>Tsuzuku</h1>
    <span class="status" id="status"><span class="dot" id="dot"></span><span id="last">never synced</span></span>
    <button id="sync" class="icon-btn" type="button" aria-label="Sync with Crunchyroll now" title="Sync with Crunchyroll now"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 9.5A8 8 0 0 0 5.2 7.2M4.5 4v3.5H8M4.5 14.5a8 8 0 0 0 14.3 2.3M19.5 20v-3.5H16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="gear" class="icon-btn" type="button" aria-pressed="false" aria-controls="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-2.6-1.5L14.1 2.5h-4.2l-.4 2.5a7.5 7.5 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4.2l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.3.9 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
  </header>

  <div class="alert" id="alert" role="alert" hidden>
    <span class="msg" id="error"></span>
    <button id="allowCr" type="button" hidden>Allow Crunchyroll</button>
  </div>
  <p class="note" id="result"></p>

  <main>
    <section class="view" id="upnextView" aria-labelledby="upnextTitle">
      <div class="head"><h2 id="upnextTitle">Up next</h2><span class="count" id="count"></span></div>
      <p class="stale" id="stale" role="status"></p>
      <div class="list" id="upnext"><div class="empty">Loading…</div></div>
    </section>

    <section class="view" id="settings" aria-labelledby="settingsTitle" hidden>
      <h2 id="settingsTitle">Connection</h2>
      <div class="group">
        <label class="field">Tracker URL <input id="url" spellcheck="false" placeholder="https://tsuzuku.okanerturan.com"></label>
        <label class="field">Tracker key <input id="key" type="password" autocomplete="off" placeholder="Your passphrase"></label>
        <p class="hint">Easier: on the tracker's Sync page, press “Set up the extension in this browser”.</p>
        <label class="field" id="pairBox" hidden>Pairing code <span class="pair-row"><input id="pair" autocomplete="one-time-code" placeholder="XXXX-XXXX from the Connect page" spellcheck="false"><button id="pairGo" class="secondary" type="button">Connect</button></span></label>
        <div class="row" id="pairResult"></div>
      </div>
      <h2>Options</h2>
      <div class="group">
        <label class="switch">New-episode notifications <input type="checkbox" id="notify"></label>
        <label class="switch">Progress card on Crunchyroll show pages <input type="checkbox" id="overlay"></label>
      </div>
      <h2>Repair</h2>
      <div class="group">
        <p class="hint">Reads your whole Crunchyroll history again, not just what's new. Takes a minute.</p>
        <button id="full" class="secondary" type="button">Full resync</button>
        <p class="hint" id="version"></p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <a class="btn" id="open" href="#" target="_blank">Open Tsuzuku</a>
  </footer>
  <script src="upnext-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
